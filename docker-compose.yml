
services:

  database:
    image: postgres:15-alpine
    # Nombre cambiado para pruebas
    container_name: freshbasket-database-pruebas
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: Freshbasket_BD
    ports:
      # Puerto cambiado (de 5432 a 5433)
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/respaldo_freshbasket.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - freshbasket-network

  backend:
    build: ./backend
    # Nombre cambiado para pruebas
    container_name: freshbasket-backend-pruebas
    restart: always
    ports:
      # Puerto cambiado (de 8080 a 8081)
      - "0.0.0.0:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://freshbasket-database-pruebas:5432/Freshbasket_BD"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
    volumes:
      - ./backend-uploads:/app/uploads
    depends_on:
      - database
    networks:
      - freshbasket-network

  frontend:
    build: ./frontend
    container_name: freshbasket-frontend-pruebas
    restart: always
    ports:
      # Puerto cambiado (de 80 a 81)
      - "81:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - freshbasket-network

volumes:
  pg_data:

networks:
  freshbasket-network:
    driver: bridge